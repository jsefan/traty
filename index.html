<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Траты</title>
<meta name="description" content="Учёт трат в батах">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Траты">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0F1114">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#0F1114; --surface:#181B20; --sunk:#22262D; --line:#2B3038;
  --ink:#F2F4F7; --muted:#8D95A3; --accent:#3DDC97; --accent-hi:#8FF0C4; --accent-ink:#052414;
  --accent-soft:rgba(61,220,151,.14); --warn:#FF6B6B; --warn-soft:rgba(255,107,107,.12);
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.locked{overflow:hidden}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{min-height:110px;resize:vertical;font-size:14px}
.app{max-width:620px;margin:0 auto}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2{font-size:20px}
h3{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:24px 4px 8px}

/* Header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 0 12px}
.top::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--bg)}
.arrow{width:42px;height:42px;border-radius:50%;background:var(--surface);font-size:22px;display:grid;place-items:center;flex:none;color:var(--muted)}
.period{flex:1;text-align:center;min-width:0}
.plabel{color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptotal{font-size:34px;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.title{font-size:28px;padding:6px 4px}

/* Tabs + FAB */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(15,17,20,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:5px 0}
.tabs button[aria-current=page]{color:var(--accent)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(20px,calc(50% - 290px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(0,0,0,.5);display:grid;place-items:center;z-index:6}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.fab:active{transform:scale(.95)}

/* List */
.card{background:var(--surface);border-radius:var(--r);overflow:hidden}
.day{margin-top:16px}
.dayh{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600;padding:0 4px 6px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:active,.crow:active,.mrow:active{background:var(--sunk)}
.ie{width:38px;height:38px;border-radius:11px;background:var(--sunk);display:grid;place-items:center;font-size:19px;flex:none}
.it{flex:1;min-width:0;display:flex;flex-direction:column}
.in{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inote{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ia{font-weight:650;white-space:nowrap}
.filter{display:flex;align-items:center;gap:8px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:7px 8px 7px 14px;font-weight:600;font-size:14px}
.pill button{width:22px;height:22px;border-radius:50%;background:rgba(61,220,151,.2);font-size:12px;display:grid;place-items:center}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.empty p{margin:0 0 16px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--sunk);font-weight:650}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:9px}
.stack{display:grid;gap:10px;margin-top:16px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet-card{background:var(--surface);width:100%;max-width:620px;max-height:94dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet-card.tall{height:94dvh}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.x{width:34px;height:34px;border-radius:50%;background:var(--sunk);color:var(--muted);display:grid;place-items:center;font-size:14px;flex:none}
.entry{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr);gap:8px;align-items:end;margin-top:12px}
.times{color:var(--muted);font-size:22px;padding-bottom:12px}
input.big{font-size:20px;font-weight:600;padding:13px 14px}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--sunk);border-radius:12px;padding:12px 14px;margin-top:12px;color:var(--muted);font-weight:600}
.total b{color:var(--ink);font-size:24px;font-weight:750}
input.bad{outline:2px solid var(--warn);outline-offset:-1px}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sug:empty{display:none}
.sug button{background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:7px 11px;font-size:14px;font-weight:600}
.sug small{color:var(--muted);font-weight:500;margin-left:4px}
.amt{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:10px 0 14px}
.amt input{background:none;border:0;font-size:44px;font-weight:750;text-align:center;padding:0;width:6.5ch;letter-spacing:-.02em}
.amt input:focus{outline:0}
.amt span{font-size:30px;color:var(--muted);font-weight:600}
.amt.bad input{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--sunk);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:550;border:1px solid transparent}
.chips button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;margin-top:14px}
.field{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.field>*:not(span){color:var(--ink);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 0}
.check{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}

/* Stats */
.seg{display:flex;background:var(--surface);border-radius:11px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed=true]{background:var(--sunk);color:var(--ink)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:20px;font-weight:700}
.kpi span{color:var(--muted);font-size:13px}
.chart{background:var(--surface);border-radius:var(--r);padding:12px 14px 10px}
.cap{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px;min-height:18px}
.cap b{color:var(--ink);font-weight:650}
.cols{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line)}
.cols button{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.cols i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.cols button.on i{background:var(--accent-hi)}
.cols button.zero i{height:2px!important;background:var(--line);border-radius:1px}
.axis{display:flex;gap:2px;color:var(--muted);font-size:11px;margin-top:5px}
.axis span{flex:1;text-align:center;white-space:nowrap;overflow:visible;min-width:0}
.crow{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.crow:first-child{border-top:0}
.crow .ie{grid-row:1/3}
.crow.noicon{grid-template-columns:minmax(0,1fr) auto}
.crow.noicon .cbar{grid-column:1/3}
.cname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname small{color:var(--muted);font-weight:500;margin-left:6px;font-size:13px}
.cbar{grid-column:2/4;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.tview{margin-top:10px}
.tview summary{color:var(--muted);font-size:13px;padding:6px 4px;cursor:pointer}

/* More */
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-top:1px solid var(--line);min-height:52px}
.mrow:first-child{border-top:0}
.mrow .grow{flex:1;min-width:0}
.mrow .sub{display:block;color:var(--muted);font-size:13px}
.mrow .chev{color:var(--muted)}
.foot{color:var(--muted);font-size:13px;text-align:center;margin:28px 0 8px}

/* Import */
.box{background:var(--sunk);border-radius:12px;padding:12px 14px;margin-top:14px}
.box p{margin:0}
.box p+p{margin-top:6px}
.sum{font-size:17px;font-weight:650}
.warnbox{background:var(--warn-soft);color:#FFB3B3}
.warnbox summary{cursor:pointer;font-weight:600}
.warnbox ul{margin:8px 0 0;padding-left:18px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th{text-align:left;color:var(--muted);font-weight:600;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;padding-right:0;white-space:nowrap}
.colsel{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:#2F343C;color:var(--ink);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:calc(100% - 32px);font-size:14px;animation:fade .15s}
.toast button{color:var(--accent);font-weight:700;padding:4px}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>

<button class="fab" id="fab" data-act="add" aria-label="Добавить трату"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs">
  <button data-act="view" data-arg="list"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Траты</button>
  <button data-act="view" data-arg="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Итоги</button>
  <button data-act="view" data-arg="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Ещё</button>
</nav>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const APP_VERSION = "1.5.0";
const KEY = "traty-v1";
const DEFAULT_CATS = [
  ["food", "🛒", "Продукты"], ["cafe", "🍜", "Кафе"], ["transport", "🛵", "Транспорт"],
  ["home", "🏠", "Жильё"], ["bills", "💡", "Связь и счета"], ["health", "💊", "Здоровье"],
  ["shop", "🛍️", "Покупки"], ["fun", "🎉", "Развлечения"], ["travel", "✈️", "Поездки"], ["pets", "🐈", "Питомцы"], ["household", "🧽", "Хозтовары"],
  ["other", "📦", "Другое"],
];
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_SHORT = ["Я","Ф","М","А","М","И","И","А","С","О","Н","Д"];
const WD = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n) => String(n).padStart(2, "0");
const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const r2 = (n) => Math.round(n * 100) / 100;

// ---------- Storage ----------
function freshState() {
  return { v: 1, cats: DEFAULT_CATS.map(([id, e, n]) => ({ id, e, n })), items: [], imports: [], lastCat: "food", m: AUTO_CATS.map((a) => a.id) };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.items) && Array.isArray(s.cats)) return normalize(s);
  } catch (e) { /* broken storage: start fresh */ }
  return freshState();
}
// Categories recognised from the item name. Each is added once to older saved data,
// and matching purchases sitting in "Другое" move into it.
// The patterns avoid look-alikes: "котлеты", "скотч", "кошелёк".
const AUTO_CATS = [
  { id: "pets", e: "🐈", n: "Питомцы", rx: /(^|[^а-яё])(кош(?!ел)|кот(?!лет)|котён|корм|питом|собак|пёс|щен|ветерин|ветклин|наполнит|лоток|когтеточ)|(pets?|cats?|dogs?)/i },
  { id: "household", e: "🧽", n: "Хозтовары", rx: /(^|[^а-яё])(хоз|бытов|моющ|мыло|порош|губк|чистящ|стирк|отбел|кондиционер для бел|туалетн|салфет|пакет|мешк|швабр|тряпк|посуд|сковород|кастрюл|фольг|пищев.{0,3}плён|батарейк|лампоч)/i },
];
const guessCat = (name) => AUTO_CATS.find((a) => a.rx.test(name || "") && S.cats.some((c) => c.id === a.id))?.id || null;
function normalize(s) {
  s.imports = Array.isArray(s.imports) ? s.imports : [];
  s.m = Array.isArray(s.m) ? s.m : [];
  // 1.3 shipped the pets category with a paw icon; switch it to the cat unless the user picked their own
  const pets = s.cats.find((c) => c.id === "pets");
  if (pets && pets.e === "🐾") pets.e = "🐈";
  for (const a of AUTO_CATS) {
    if (s.m.includes(a.id)) continue;
    const same = s.cats.find((c) => c.n.toLowerCase() === a.n.toLowerCase());
    if (same && same.id !== a.id) { // the user already made such a category: adopt it
      s.items.forEach((i) => { if (i.c === same.id) i.c = a.id; });
      same.id = a.id;
    } else if (!same) {
      const k = s.cats.findIndex((c) => c.id === "other");
      s.cats.splice(k < 0 ? s.cats.length : k, 0, { id: a.id, e: a.e, n: a.n });
    }
    s.items.forEach((i) => { if (i.c === "other" && a.rx.test(i.n || "")) i.c = a.id; });
    s.m.push(a.id);
  }
  if (!s.cats.some((c) => c.id === "other")) s.cats.push({ id: "other", e: "📦", n: "Другое" });
  const ids = new Set(s.cats.map((c) => c.id));
  s.items.forEach((i) => { if (!ids.has(i.c)) i.c = "other"; });
  return s;
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast("Не удалось сохранить: память браузера заполнена"); }
}
const cat = (id) => S.cats.find((c) => c.id === id) || S.cats.find((c) => c.id === "other");

// ---------- Formatting ----------
function fmtNum(a) {
  const v = r2(a);
  return Number.isInteger(v) ? v.toLocaleString("ru-RU") : v.toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
const fmt = (a) => fmtNum(a) + " ฿";
const monthLabel = (ym) => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const dmy = (iso) => `${iso.slice(8, 10)}.${iso.slice(5, 7)}.${iso.slice(0, 4)}`;
function dayLabel(iso) {
  const t = today();
  const y = new Date(); y.setDate(y.getDate() - 1);
  const d = new Date(iso + "T12:00:00");
  const tail = `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
  if (iso === t) return `Сегодня, ${tail}`;
  if (iso === isoOf(y)) return `Вчера, ${tail}`;
  return `${WD[d.getDay()]}, ${tail}`;
}
function shiftMonth(ym, n) {
  const d = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
const daysIn = (ym) => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();

// Accepts "1 200", "1,200", "12,50", "1.234,5", "฿120", "-45" → positive-or-negative number with 2 decimals
function parseAmount(v) {
  if (v == null) return null;
  let s = String(v).trim();
  if (!s) return null;
  s = s.replace(/[\s  ']/g, "").replace(/[^\d.,]/g, "");
  if (!/\d/.test(s)) return null;
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc >= 0 && ld >= 0) {
    const dec = lc > ld ? "," : ".";
    s = s.split(dec === "," ? "." : ",").join("").replace(dec, ".");
  } else if (lc >= 0) {
    const p = s.split(",");
    s = p.length > 2 || (p.length === 2 && p[1].length === 3) ? p.join("") : p.join(".");
  } else if (ld >= 0) {
    const p = s.split(".");
    if (p.length > 2) s = p.join("");
  }
  const n = parseFloat(s);
  return isFinite(n) ? r2(n) : null;
}

// ---------- Stats ----------
function statsHtml() {
  const key = periodKey(), year = key.length === 4;
  const items = S.items.filter((i) => i.d.startsWith(key));
  const total = items.reduce((s, i) => s + i.a, 0);
  let h = `<div class="seg"><button data-act="mode" data-arg="month" aria-pressed="${!year}">Месяц</button><button data-act="mode" data-arg="year" aria-pressed="${year}">Год</button></div>`;

  // Average: per day for a month, per month for a year; counts only the elapsed part of the current period
  const t = today();
  let avg = null, avgLabel;
  if (year) {
    const n = key < t.slice(0, 4) ? 12 : key === t.slice(0, 4) ? +t.slice(5, 7) : 0;
    avg = n ? total / n : null; avgLabel = "в среднем за месяц";
  } else {
    const n = key < t.slice(0, 7) ? daysIn(key) : key === t.slice(0, 7) ? +t.slice(8, 10) : 0;
    avg = n ? total / n : null; avgLabel = "в среднем за день";
  }
  h += `<div class="kpis"><div class="kpi"><b class="num">${avg == null ? "—" : fmt(avg)}</b><span>${avgLabel}</span></div>
    <div class="kpi"><b class="num">${items.length.toLocaleString("ru-RU")}</b><span>${plural(items.length, "трата", "траты", "трат")}</span></div></div>`;

  // Column chart: daily totals for a month, monthly totals for a year
  const buckets = year ? Array.from({ length: 12 }, (_, m) => ({ k: `${key}-${pad(m + 1)}`, label: MONTHS_SHORT[m], name: `${MONTHS[m]} ${key}`, v: 0 }))
    : Array.from({ length: daysIn(key) }, (_, d) => ({ k: `${key}-${pad(d + 1)}`, label: [1, 10, 20].includes(d + 1) || d + 1 === daysIn(key) ? String(d + 1) : "", name: `${d + 1} ${MONTHS_GEN[+key.slice(5, 7) - 1]}`, v: 0 }));
  const idx = new Map(buckets.map((b, n) => [b.k, n]));
  items.forEach((i) => { const n = idx.get(year ? i.d.slice(0, 7) : i.d); if (n != null) buckets[n].v += i.a; });
  const max = Math.max(...buckets.map((b) => b.v), 0);
  const on = buckets.find((b) => b.k === U.tip);
  h += `<div class="chart"><div class="cap" id="cap">${on ? `<span>${esc(on.name)}</span><b class="num">${fmt(on.v)}</b>` : `<span>${year ? "По месяцам" : "По дням"}</span><span></span>`}</div>
    <div class="cols" role="img" aria-label="${year ? "Траты по месяцам" : "Траты по дням"}">${buckets.map((b) =>
      `<button class="${b.v ? "" : "zero"} ${b.k === U.tip ? "on" : ""}" data-act="tip" data-arg="${b.k}" aria-label="${esc(b.name)}: ${fmt(b.v)}"><i style="height:${max ? Math.max(2, (b.v / max) * 100) : 0}%"></i></button>`).join("")}</div>
    <div class="axis">${buckets.map((b) => `<span>${b.label}</span>`).join("")}</div></div>`;

  // Breakdown: by category or by item name (like a SUMIF over the "Название" column)
  const byName = U.group === "name";
  const by = new Map();
  items.forEach((i) => {
    const k = byName ? (i.n || "").trim().toLowerCase() || "—" : i.c;
    const e = by.get(k) || { v: 0, n: 0, label: (i.n || "").trim() || "Без названия" };
    e.v += i.a; e.n++;
    by.set(k, e);
  });
  const rows = [...by.entries()].sort((a, b) => b[1].v - a[1].v);
  h += `<div class="seg" style="margin:22px 0 10px"><button data-act="group" data-arg="cat" aria-pressed="${!byName}">По категориям</button><button data-act="group" data-arg="name" aria-pressed="${byName}">По названиям</button></div>`;
  if (!rows.length) return h + `<div class="card"><div class="empty" style="padding:28px">Нет трат за этот период</div></div>`;
  const top = rows[0][1].v;
  h += `<div class="card">${rows.map(([k, e]) => {
    const pct = total ? Math.round((e.v / total) * 100) : 0;
    const bar = `<span class="cbar"><i style="width:${(e.v / top) * 100}%"></i></span>`;
    if (byName) {

      <span class="cname">${esc(c.n)}<small>${pct}%</small></span><span class="ia num">${fmt(e.v)}</span>${bar}</button>`;
  }).join("")}</div>`;
  return h;
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many;
}

const numIn = (v) => String(v).replace(".", ",");
function formSum() {

// ---------- Files ----------
function pickFile(accept, cb) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = accept; inp.hidden = true;
  inp.addEventListener("change", () => { const f = inp.files[0]; inp.remove(); if (f) cb(f); });
  document.body.append(inp);
  inp.click();
}
async function saveFile(name, text, type) {
  const blob = new Blob([text], { type });
  const file = new File([blob], name, { type });
  if (matchMedia("(pointer:coarse)").matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportCsv(items, name) {
  if (!items.length) { toast("Нечего выгружать — трат нет"); return; }
  const q = (s) => /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  const lines = ["Дата;Название;Цена;Количество;Сумма;Категория"];
  items.slice().sort((a, b) => a.d.localeCompare(b.d) || (a.t || 0) - (b.t || 0))
    .forEach((i) => lines.push([dmy(i.d), q(i.n || ""), numIn(i.p ?? i.a), numIn(i.q ?? 1), numIn(i.a), q(cat(i.c).n)].join(";")));
  // BOM + semicolons + decimal comma: opens correctly in Excel with Russian settings
  saveFile(name, "﻿" + lines.join("\r\n") + "\r\n", "text/csv;charset=utf-8");
}

const colIndex = (ref) => { let n = 0; for (const ch of ref.replace(/\d+$/, "")) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };

function decodeText(u8) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(u8); }
  catch (e) { return new TextDecoder("windows-1251").decode(u8); }
}
function parseDelimited(text) {
  text = text.replace(/^﻿/, "");

  const count = (ch) => sample.split(ch).length - 1;
  const d = count("\t") ? "\t" : count(";") >= count(",") ? ";" : ",";
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"' && f === "") q = true;
    else if (c === d) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(f); rows.push(row); row = []; f = "";
    } else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return cleanRows(rows);
}
function cleanRows(rows) {
  const out = Array.from(rows, (r) => Array.from(r || [], (v) => String(v ?? "").trim()))
    .filter((r) => r.some((v) => v !== ""));
  const w = Math.max(0, ...out.map((r) => r.length));
  out.forEach((r) => { while (r.length < w) r.push(""); });
  return out;
}

// Minimal .xlsx reader: ZIP central directory + DecompressionStream, then the sheet XML
async function readXlsx(buf) {
  const dv = new DataView(buf);
  let e = buf.byteLength - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error("файл повреждён");
  const files = {};
  let p = dv.getUint32(e + 16, true);
  for (let i = 0, n = dv.getUint16(e + 10, true); i < n; i++) {
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nl));
    files[name] = { method: dv.getUint16(p + 10, true), size: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) };
    p += 46 + nl + xl + cl;
  }
  const get = async (name) => {
    const f = files[name];
    if (!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const data = new Uint8Array(buf, start, f.size);
    if (f.method === 0) return new TextDecoder().decode(data);
    if (typeof DecompressionStream === "undefined") throw new Error("браузер слишком старый для .xlsx — сохрани таблицу как CSV");
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  };
  const wbX = await get("xl/workbook.xml");
  if (!wbX) throw new Error("это не файл Excel (.xlsx) — экспортируй таблицу в Excel или CSV");
  const P = (x) => new DOMParser().parseFromString(x, "application/xml");
  const T = (node, tag) => [...node.getElementsByTagNameNS("*", tag)];
  const rels = {};
  const relX = await get("xl/_rels/workbook.xml.rels");
  if (relX) T(P(relX), "Relationship").forEach((r) => { rels[r.getAttribute("Id")] = r.getAttribute("Target"); });
  const ssX = await get("xl/sharedStrings.xml");
  const ss = ssX ? T(P(ssX), "si").map((si) => T(si, "t").filter((t) => t.parentNode.localName !== "rPh").map((t) => t.textContent).join("")) : [];
  const out = [];
  for (const sh of T(P(wbX), "sheet")) {
    const rid = sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id") || sh.getAttribute("r:id");
    let tgt = rels[rid];
    if (!tgt) continue;
    tgt = tgt.startsWith("/") ? tgt.slice(1) : "xl/" + tgt.replace(/^\.\//, "");
    const x = await get(tgt);
    if (!x) continue;
    const rows = [];
    for (const row of T(P(x), "row")) {
      const ri = (+row.getAttribute("r") || rows.length + 1) - 1;
      const arr = [];
      let ci = 0;
      for (const c of row.children) {
        if (c.localName !== "c") continue;
        const ref = c.getAttribute("r");
        if (ref) ci = colIndex(ref);
        const t = c.getAttribute("t");
        const v = T(c, "v")[0]?.textContent ?? "";
        arr[ci] = t === "s" ? ss[+v] ?? "" : t === "inlineStr" ? T(c, "t").map((n) => n.textContent).join("") : t === "b" ? (v === "1" ? "ИСТИНА" : "ЛОЖЬ") : v;
        ci++;
      }
      rows[ri] = arr;
    }
    out.push({ name: sh.getAttribute("name") || `Лист ${out.length + 1}`, rows: cleanRows(rows) });
  }
  if (!out.length) throw new Error("в файле не нашлось листов");
  return out;
}

const RU_MON = [/^янв/, /^фев/, /^мар/, /^апр/, /^ма[йя]/, /^июн/, /^июл/, /^авг/, /^сен/, /^окт/, /^ноя/, /^дек/];
const EN_MON = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
const DATE_RX = /^(\d{1,2})[./-](\d{1,2})[./-](\d{2}|\d{4})(?!\d)/;
// Returns "YYYY-MM-DD" or null. df: "dmy" | "mdy"
function parseDate(v, df = "dmy") {
  const s = String(v ?? "").trim().toLowerCase();
  if (!s) return null;
  let y, m, d, mm;
  if (/^\d{5}(\.\d+)?$/.test(s)) { // Excel serial date
    const n = Math.floor(+s);
    if (n < 25000 || n > 80000) return null;
    const dt = new Date(Date.UTC(1899, 11, 30) + n * 864e5);
    y = dt.getUTCFullYear(); m = dt.getUTCMonth() + 1; d = dt.getUTCDate();
  } else if ((mm = s.match(/^(\d{4})[./-](\d{1,2})[./-](\d{1,2})/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = s.match(DATE_RX))) {
    y = +mm[3]; if (y < 100) y += 2000;
    [d, m] = df === "mdy" ? [+mm[2], +mm[1]] : [+mm[1], +mm[2]];
  } else if ((mm = s.match(/^(\d{1,2})\s+([a-zа-яё]+)\.?,?\s*(\d{4})?/))) {
    d = +mm[1]; m = RU_MON.findIndex((r) => r.test(mm[2])) + 1 || EN_MON.indexOf(mm[2].slice(0, 3)) + 1;
    y = mm[3] ? +mm[3] : new Date().getFullYear();
  } else if ((mm = s.match(/^([a-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/))) {
    m = EN_MON.indexOf(mm[1]) + 1; d = +mm[2]; y = +mm[3];
  } else return null;
  if (!m || m > 12 || !d || d > 31 || y < 2000 || y > 2100) return null;
  const dt = new Date(y, m - 1, d);
  if (dt.getMonth() !== m - 1) return null;
  return `${y}-${pad(m)}-${pad(d)}`;
}
const looksNumber = (v) => /^[-−(]?\s*[฿$€₽]?\s*[\d\s  .,']+\s*(฿|бат|baht|thb|\$|€|₽|руб\.?)?\)?$/i.test(String(v).trim()) && /\d/.test(v);
const looksTextDate = (v) => { const s = String(v).trim(); return !/^\d{5}(\.\d+)?$/.test(s) && !!parseDate(s); };
const TOTAL_RX = /^(итого|всего|total|сумма за|итог)/i;

const HDR = {
  d: /дат|date|день|day|когда|число/i,
  p: /цен|price|стоим|за шт|unit/i,
  q: /кол|qty|шт|quant|count|вес|кг/i,
  a: /сумм|amount|^sum|бат|baht|฿|thb|потрач|расход|spent|cost|руб/i,
  c: /катег|category|тип|type|статья|групп|group|раздел/i,
  n: /назв|товар|продукт|покупк|что|name|item|product|коммент|опис|note|comment|descr|детал|memo|примеч|где|магаз|shop/i,
};
const MON_IN_NAME = [/январ/, /феврал/, /март/, /апрел/, /ма[йя]/, /июн/, /июл/, /август/, /сентябр/, /октябр/, /ноябр/, /декабр/];
// "Покупки - Ноябрь 2026.csv" → 2026-11-01; otherwise today
function dateFromName(name) {
  const s = String(name).toLowerCase();
  const y = s.match(/20\d\d/), m = MON_IN_NAME.findIndex((r) => r.test(s));
  return y && m >= 0 ? `${y[0]}-${pad(m + 1)}-01` : today();
}
const cellNum = (v) => (v && looksNumber(v) ? parseAmount(v) : null);

function colStats(rows, start) {
  const data = rows.slice(start, start + 200);
  const w = rows[0]?.length || 0;
  return Array.from({ length: w }, (_, i) => {
    const vals = data.map((r) => r[i]).filter((v) => v !== "");
    const k = vals.length || 1;
    return {
      filled: vals.length,
      textDate: vals.filter(looksTextDate).length / k,
      serial: vals.filter((v) => /^\d{5}(\.\d+)?$/.test(v) && parseDate(v)).length / k,
      num: vals.filter(looksNumber).length / k,
      ones: vals.filter((v) => cellNum(v) === 1).length / k,

}
// Finds three numeric columns where price × quantity = sum in most rows
function findTriple(rows, start, cols) {
  const data = rows.slice(start, start + 200);
  let best = null;
  for (const k of cols) for (const i of cols) for (const j of cols) {
    if (i >= j || i === k || j === k) continue;
    let hit = 0, tot = 0;
    for (const r of data) {
      const s = cellNum(r[k]);
      if (!s) continue;
      tot++;
      const x = cellNum(r[i]), y = cellNum(r[j]);
      if (x != null && y != null && Math.abs(x * y - s) <= Math.max(0.01, Math.abs(s) * 0.005)) hit++;
    }
    if (tot >= 3 && hit / tot >= 0.8 && (!best || hit > best.hit)) best = { i, j, k, hit };
  }

}
function autoConfig(rows, name) {

  const start = header ? 1 : 0;
  const st = colStats(rows, start);
  const H = header ? r0 : r0.map(() => "");
  const used = new Set();
  const byHdr = (k, ok = () => true) => { const i = H.findIndex((h, n) => h && !used.has(n) && HDR[k].test(h) && ok(n)); if (i >= 0) used.add(i); return i; };
  const best = (score) => { let bi = -1, bs = 0; st.forEach((s, i) => { if (used.has(i) || !s.filled) return; const v = score(s); if (v > bs) { bs = v; bi = i; } }); if (bi >= 0) used.add(bi); return bi; };

  const fullest = Math.max(0, ...st.map((s) => s.filled));

  if (d < 0) d = best((s) => (s.filled < fullest * 0.5 ? 0 : s.textDate > 0.6 ? 2 + s.textDate : s.serial > 0.8 ? 1 + s.serial : 0));
  let p = byHdr("p", (n) => st[n].num > 0.5);
  let q = byHdr("q", (n) => st[n].num > 0.5);
  let a = byHdr("a", (n) => st[n].num > 0.5);
  const c = byHdr("c");
  let n = byHdr("n");
  if (p < 0 && q < 0) {
    const t = findTriple(rows, start, st.map((s, i) => i).filter((i) => !used.has(i) && st[i].num > 0.8));
    if (t && (a < 0 || a === t.k)) {

  return { header, mode, map: { d, p, q, a, c, n }, wide: numericCols, df, dfAuto: df, skipDup: true, fixedDate: dateFromName(name), defCat: "other" };
}

async function handleFile(f) {
  try {
    const buf = await f.arrayBuffer();
    const u8 = new Uint8Array(buf);
    let sheets;
    if (u8[0] === 0x50 && u8[1] === 0x4b) sheets = await readXlsx(buf);
    else if (u8[0] === 0xd0 && u8[1] === 0xcf) throw new Error("старый формат .xls не поддерживается — пересохрани таблицу как .xlsx или CSV");
    else sheets = [{ name: f.name, rows: parseDelimited(decodeText(u8)) }];
    startMapping(f.name, sheets);
  } catch (e) { toast("Не получилось прочитать файл: " + e.message); }
}
function startMapping(name, sheets) {
  sheets = sheets.filter((s) => s.rows.length);
  if (!sheets.length) { toast("В таблице нет данных"); return; }
  const si = sheets.reduce((b, s, i) => (s.rows.length > sheets[b].rows.length ? i : b), 0);
  IMP = { name, sheets, si, ...autoConfig(sheets[si].rows, name) };
  renderImport();
}

function computeImport() {
  const rows = IMP.sheets[IMP.si].rows;
  const { map, header, mode, df } = IMP;
  const H = rows[0] || [];
  const ok = [], bad = [];
  let skipped = 0, last = null;
  const col = (row, k) => (map[k] >= 0 ? row[map[k]] ?? "" : "");
  if (map.d < 0 && !IMP.fixedDate) return { ok, bad, skipped, error: "Выбери дату" };
  if (mode === "rows" && map.a < 0 && map.p < 0) return { ok, bad, skipped, error: "Выбери столбец с ценой или суммой" };
  if (mode === "wide" && !IMP.wide.length) return { ok, bad, skipped, error: "Отметь столбцы-категории" };
  const prevCat = new Map(knownNames().map((x) => [x.n.toLowerCase(), x.c]));
  for (let r = header ? 1 : 0; r < rows.length; r++) {
    const row = rows[r], line = r + 1;
    if (row.some((v) => TOTAL_RX.test(v))) { skipped++; continue; }
    const name = col(row, "n");
    const cells = mode === "rows" ? [col(row, "p"), col(row, "a")] : IMP.wide.map((i) => row[i]);
    const has = cells.some((v) => v && cellNum(v) !== 0);
    let d = IMP.fixedDate;
    if (map.d >= 0) {
      const dRaw = row[map.d];
      d = dRaw ? parseDate(dRaw, df) : null;
      if (dRaw && !d) { if (has) bad.push(`Строка ${line}: не понял дату «${dRaw}»`); else skipped++; continue; }
      if (d) last = d; else d = last; // empty date cell = same day as the row above
    }
    if (!has) { skipped++; continue; }
    if (!d) { bad.push(`Строка ${line}: нет даты`); continue; }
    if (mode === "rows") {
      const [pRaw, qRaw, aRaw] = [col(row, "p"), col(row, "q"), col(row, "a")];
      const p = cellNum(pRaw), q = cellNum(qRaw), a = cellNum(aRaw);
      if (pRaw && p == null) { bad.push(`Строка ${line}: не понял цену «${pRaw}»`); continue; }
      if (qRaw && q == null) { bad.push(`Строка ${line}: не понял количество «${qRaw}»`); continue; }
      if (aRaw && a == null) { bad.push(`Строка ${line}: не понял сумму «${aRaw}»`); continue; }
      const qq = q > 0 ? q : 1;
      const A = a ? Math.abs(a) : Math.abs(p || 0) * qq; // the sum from the table wins; otherwise price × quantity
      if (!A) { skipped++; continue; }
      ok.push({ d, p: r2(p ? Math.abs(p) : A / qq), q: qq, a: r2(A), cat: col(row, "c").trim(), n: name });
    } else {
      IMP.wide.forEach((i) => {
        const v = row[i];
        if (!v) return;
        const a = cellNum(v);
        if (a == null) { bad.push(`Строка ${line}: не понял сумму «${v}»`); return; }
        if (a) ok.push({ d, p: Math.abs(a), q: 1, a: Math.abs(a), cat: header ? H[i] : `Столбец ${colLetter(i)}`, n: name });

    }
  }
  // No category in the table: the category this name had before, otherwise the chosen default
  ok.forEach((o) => { if (!o.cat) o.catId = prevCat.get(o.n.trim().toLowerCase()) || guessCat(o.n) || IMP.defCat; });
  const have = new Set(S.items.map((i) => `${i.d}|${i.a}|${(i.n || "").toLowerCase()}`));
  ok.forEach((o) => { o.dup = have.has(`${o.d}|${o.a}|${o.n.toLowerCase()}`); });
  const known = new Set(S.cats.map((c) => c.n.toLowerCase()));
  const newCats = [...new Set(ok.map((o) => o.cat).filter((c) => c && !known.has(c.toLowerCase())))];
  return { ok, bad, skipped, newCats };
}

    : `<label class="field"><span>Дата для всех строк</span><input type="date" data-imp="fixed" value="${IMP.fixedDate}"></label>`;
  if (rowsMode) h += `<label class="field"><span>Категория</span>${sel("c", "— нет —")}</label>`;
  if (rowsMode && IMP.map.c < 0) h += `<label class="field"><span>Категория, если не известна</span><select data-imp="defcat">${S.cats.map((c) => `<option value="${c.id}" ${c.id === IMP.defCat ? "selected" : ""}>${esc(c.e)} ${esc(c.n)}</option>`).join("")}</select></label>`;
  h += `</div>`;
  if (rowsMode && IMP.map.c < 0) h += `<p class="hint">Для названий, которые уже встречались, возьмётся их прошлая категория.</p>`;
  if (!rowsMode) {
    h += `<div class="field" style="margin-top:12px"><span>Столбцы-категории</span><div class="colsel">${H.map((_, i) => i === IMP.map.d || i === IMP.map.n ? "" :
      `<label class="check" style="background:var(--sunk);border-radius:9px;padding:6px 10px;font-size:14px"><input type="checkbox" data-imp="wide" value="${i}" ${IMP.wide.includes(i) ? "checked" : ""}>${esc(IMP.header ? H[i] || colLetter(i) : colLetter(i))}</label>`).join("")}</div></div>`;
  }
  if (R.error) h += `<div class="box"><p>${esc(R.error)}</p></div>`;
  else {
    h += `<div class="box"><p class="sum">${take.length} ${plural(take.length, "покупка", "покупки", "покупок")} · <span class="num">${fmt(sum)}</span></p>
      ${dates.length ? `<p class="hint">${dates[0] === dates[dates.length - 1] ? dmy(dates[0]) : `${dmy(dates[0])} — ${dmy(dates[dates.length - 1])}`}</p>` : ""}
      ${R.newCats.length ? `<p class="hint">Новые категории: ${esc(R.newCats.slice(0, 12).join(", "))}${R.newCats.length > 12 ? "…" : ""}</p>` : ""}
      ${R.skipped ? `<p class="hint">Пропущено пустых и итоговых строк: ${R.skipped}</p>` : ""}
      ${dups ? `<label class="check"><input type="checkbox" data-imp="dup" ${IMP.skipDup ? "checked" : ""}> Пропустить ${dups} ${plural(dups, "покупку", "покупки", "покупок")}, которые уже есть в приложении</label>` : ""}</div>`;
    if (R.bad.length) h += `<details class="box warnbox"><summary>Не понял ${R.bad.length} ${plural(R.bad.length, "значение", "значения", "значений")} — они не загрузятся</summary><ul>${R.bad.slice(0, 30).map((b) => `<li>${esc(b)}</li>`).join("")}${R.bad.length > 30 ? "<li>…</li>" : ""}</ul></details>`;
    if (take.length) {
      h += `<table><thead><tr><th>Название</th><th class="r">Цена × кол-во</th><th class="r">Сумма</th></tr></thead><tbody>${take.slice(0, 8).map((o) =>
        `<tr><td>${esc(o.n || "—")}<br><span class="hint" style="font-size:12px">${dmy(o.d)} · ${esc(o.cat || cat(o.catId).n)}</span></td><td class="r num">${fmtNum(o.p)} × ${fmtNum(o.q)}</td><td class="r num">${fmt(o.a)}</td></tr>`).join("")}</tbody></table>
        ${take.length > 8 ? `<p class="hint">…и ещё ${take.length - 8}</p>` : ""}`;
    }
  }
  h += `<div class="stack"><button class="btn primary block" data-act="impdo" ${take.length || (IMP.skipDup && R.ok.some((o) => o.dup && o.cat)) ? "" : "disabled"}>Загрузить ${take.length} ${plural(take.length, "покупку", "покупки", "покупок")}</button>
    <button class="btn block" data-act="import">Выбрать другую таблицу</button></div>`;
  if (card) { card.innerHTML = h; card.scrollTop = scroll; } else openSheet(h, "tall");
}

function onImportChange(el) {
  const k = el.dataset.imp;
  if (k === "sheet") { const si = +el.value; IMP = { ...IMP, si, ...autoConfig(IMP.sheets[si].rows, IMP.name) }; }
  else if (k === "map") IMP.map[el.dataset.key] = +el.value;
  else if (k === "header") IMP.header = el.checked;
  else if (k === "df") IMP.df = el.value;
  else if (k === "fixed") IMP.fixedDate = el.value;
  else if (k === "defcat") IMP.defCat = el.value;
  else if (k === "dup") IMP.skipDup = el.checked;
  else if (k === "wide") { const i = +el.value; IMP.wide = el.checked ? [...IMP.wide, i].sort((a, b) => a - b) : IMP.wide.filter((x) => x !== i); }
  renderImport();
}
// Icons for categories that a table creates, by name
const NEW_CAT_ICON = { "красота": "💅", "мото": "🏍️", "мотоцикл": "🏍️", "спорт": "🏋️", "одежда": "👕", "подарки": "🎁", "дети": "🧸", "образование": "📚", "документы": "📄", "кафе": "🍜", "продукты": "🛒", "такси": "🚕", "бензин": "⛽", "красота и уход": "💅", "животные": "🐈" };
function doImport() {
  const R = computeImport();
  const take = R.ok.filter((o) => !(IMP.skipDup && o.dup));
  const dupsWithCat = IMP.skipDup && R.ok.some((o) => o.dup && o.cat);
  if (!take.length && !dupsWithCat) return;
  const byName = new Map(S.cats.map((c) => [c.n.toLowerCase(), c.id]));
  const catId = (o) => {
    if (!o.cat) return o.catId;
    const k = o.cat.toLowerCase();
    if (!byName.has(k)) { const id = "c" + uid(); S.cats.push({ id, e: NEW_CAT_ICON[k] || "🏷️", n: o.cat }); byName.set(k, id); }
    return byName.get(k);
  };
  // Rows skipped as already present: if the table names a category and the existing purchase sits in "Другое", move it
  let moved = 0;
  if (IMP.skipDup) R.ok.filter((o) => o.dup && o.cat).forEach((o) => {
    const ex = S.items.find((i) => i.c === "other" && i.d === o.d && i.a === o.a && (i.n || "").toLowerCase() === o.n.toLowerCase());
    if (ex) { ex.c = catId(o); moved++; }
  });
  const id = uid(), now = Date.now();
  take.forEach((o, n) => S.items.push({ id: uid() + n, d: o.d, p: o.p, q: o.q, a: o.a, c: catId(o), n: o.n, t: now + n, imp: id }));
  if (take.length) S.imports.push({ id, ts: now, name: IMP.name, count: take.length });
  save();
  if (take.length) U.month = take.map((o) => o.d).sort().pop().slice(0, 7);
  U.view = "list"; U.cat = null; U.name = null;
  closeSheet(); render();
  toast(`Загружено: ${take.length} ${plural(take.length, "покупка", "покупки", "покупок")}${moved ? `, ${moved} уже внесённых получили категорию` : ""}`);
}

// ---------- Toast ----------
let toastTimer;
function toast(msg, action, fn) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ""}`;
  t.hidden = false;
  if (action) t.querySelector("button").onclick = () => { t.hidden = true; fn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, action ? 5000 : 3000);
}

// ---------- Events ----------
const ACT = {
  view: (v) => { U.view = v; U.tip = null; if (v !== "list") { U.cat = null; U.name = null; } render(); scrollTo(0, 0); },
  prev: () => { U.month = shiftMonth(U.month, periodKey().length === 4 ? -12 : -1); U.tip = null; render(); },
  next: () => { U.month = shiftMonth(U.month, periodKey().length === 4 ? 12 : 1); U.tip = null; render(); },
  mode: (m) => { U.mode = m; U.tip = null; render(); },
  tip: (k) => { U.tip = U.tip === k ? null : k; render(); },
  group: (g) => { U.group = g; render(); },
  namefilter: (k) => { U.name = k; U.cat = null; U.view = "list"; if (U.mode === "year") U.mode = "month"; render(); scrollTo(0, 0); },
  catfilter: (id) => { U.cat = id; U.name = null; U.view = "list"; if (U.mode === "year") U.mode = "month"; render(); scrollTo(0, 0); },
  clearcat: () => { U.cat = null; U.name = null; render(); },
  add: () => openForm(null),
  edit: (id) => openForm(id),
  pick: (id) => { F.catTouched = true; setCat(id); },
  sug: (name) => pickSug(name),
  save: () => saveForm(false),
  savemore: () => saveForm(true),
  del: deleteItem,
  close: closeSheet,
  catedit: (id) => openCat(id),
  catsave: (id) => saveCat(id),
  catdel: (id) => deleteCat(id),
  import: openImport,
  impfile: () => pickFile(".csv,.tsv,.txt,.xlsx,.xls,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", handleFile),
  imppaste: () => { const t = $("#impPaste").value; if (!t.trim()) { $("#impPaste").focus(); return; } startMapping("Вставленные ячейки", [{ name: "Вставка", rows: parseDelimited(t) }]); },
  impmode: (m) => { IMP.mode = m; renderImport(); },
  impdo: doImport,
  undoimp: (id) => {
    const m = S.imports.find((x) => x.id === id);
    const n = S.items.filter((i) => i.imp === id).length;
    if (!confirm(`Удалить ${n} ${plural(n, "трату", "траты", "трат")}, загруженные из «${m.name}»?`)) return;
    S.items = S.items.filter((i) => i.imp !== id);
    S.imports = S.imports.filter((x) => x.id !== id);
    save(); render(); toast("Загрузка отменена");
  },
  csvmonth: () => exportCsv(S.items.filter((i) => i.d.startsWith(U.month)), `траты-${U.month}.csv`),
  csvall: () => exportCsv(S.items, `траты-все-${today()}.csv`),
  backup: () => saveFile(`траты-копия-${today()}.json`, JSON.stringify(S), "application/json"),
  restore: () => pickFile(".json,application/json", async (f) => {
    try {
      const s = JSON.parse(await f.text());
      if (!s || !Array.isArray(s.items) || !Array.isArray(s.cats)) throw new Error();
      if (!confirm(`Заменить текущие данные копией (${s.items.length} ${plural(s.items.length, "трата", "траты", "трат")})?`)) return;
      S = normalize(s); save(); render(); toast("Данные восстановлены");
    } catch (e) { toast("Это не файл копии «Траты»"); }
  }),
};

document.addEventListener("click", (e) => {
  if (e.target.id === "sheet") { closeSheet(); return; }
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset.arg);
});
document.addEventListener("change", (e) => { if (e.target.dataset.imp) onImportChange(e.target); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#sheet").hidden) closeSheet();
  if (e.key === "Enter" && F && e.target.id === "fN") { e.preventDefault(); $("#fS").innerHTML = ""; $("#fA").focus(); }
  if (e.key === "Enter" && F && e.target.id === "fA") { e.preventDefault(); $("#fQ").focus(); }
  if (e.key === "Enter" && F && e.target.id === "fQ") { e.preventDefault(); saveForm(false); }
});
// Desktop: hovering a chart column shows its value
document.addEventListener("pointerover", (e) => {
  if (e.pointerType !== "mouse") return;
  const b = e.target.closest(".cols button");
  if (!b || U.tip === b.dataset.arg) return;
  U.tip = b.dataset.arg; render();
});

render();

// iOS resumes a home-screen app where it was left (another month, a filter, or a stale month after midnight
// on the 1st). Coming back after more than a minute away: show the current month again.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
  if (!hiddenAt || Date.now() - hiddenAt < 60e3 || !$("#sheet").hidden) return;
  U.month = today().slice(0, 7); U.cat = null; U.name = null; U.tip = null;
  if (U.view === "more") U.view = "list";
  render();
});
// Updates (same as Подход): check for a new version whenever the app comes to the screen;
// when it has installed, reload once. If a form is open, wait until it is closed so nothing typed is lost.
let updatePending = false;
const applyUpdate = () => setTimeout(() => location.reload(), 150);
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return;
    reloading = true;
    if ($("#sheet").hidden) applyUpdate(); else updatePending = true;
  });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {}));
}
</script>
</body>
